services:
  postgres:
    image: postgres:16-alpine
    container_name: autosphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autosphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autosphere_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-autosphere}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autosphere} -d ${POSTGRES_DB:-autosphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autosphere_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: autosphere_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosphere}:${POSTGRES_PASSWORD:-autosphere_dev_password}@postgres:5432/${POSTGRES_DB:-autosphere}?schema=public
      API_PORT: ${API_PORT:-4000}
      API_HOST: 0.0.0.0
      API_PREFIX: ${API_PREFIX:-api/v1}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      TENANT_HEADER: ${TENANT_HEADER:-x-tenant-id}
      TENANT_STRATEGY: ${TENANT_STRATEGY:-jwt}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/api/node_modules
    networks:
      - autosphere_network
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm run dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: autosphere_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AutoSphere}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    networks:
      - autosphere_network

volumes:
  postgres_data:
    driver: local

networks:
  autosphere_network:
    driver: bridge
